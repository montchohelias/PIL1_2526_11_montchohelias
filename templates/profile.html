{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 text-primary">
                    <i class="bi bi-person"></i> Mon Profil
                </h2>
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" class="form-control" value="{{ current_user.nom }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Prenom</label>
                            <input type="text" name="prenom" class="form-control" value="{{ current_user.prenom }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea name="bio" class="form-control" rows="3">{{ current_user.bio or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mes competences</label>
                        <select name="competences" class="form-select" multiple size="4">
                            {% for c in competences %}
                            <option value="{{ c.id }}" {{ 'selected' if c in current_user.competences else '' }}>{{ c.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mes lacunes</label>
                        <select name="lacunes" class="form-select" multiple size="4">
                            {% for c in competences %}
                            <option value="{{ c.id }}" {{ 'selected' if c in current_user.lacunes else '' }}>{{ c.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Enregistrer
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
