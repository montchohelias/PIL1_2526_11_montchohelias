{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-light">
                <h5 class="mb-0">
                    {% for p in conversation.participants %}
                        {% if p.id != current_user.id %}
                            <i class="bi bi-person-circle"></i> {{ p.prenom }} {{ p.nom }}
                        {% endif %}
                    {% endfor %}
                </h5>
            </div>
            <div class="card-body chat-box" id="chat-box" style="height: 400px; overflow-y: auto; background: #f0f2f5;">
                {% for msg in messages %}
                <div class="d-flex mb-3 {{ 'justify-content-end' if msg.expediteur_id == current_user.id else 'justify-content-start' }}">
                    <div class="p-3 rounded-3 {{ 'bg-primary text-white' if msg.expediteur_id == current_user.id else 'bg-white' }}" 
                         style="max-width: 70%; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                        <p class="mb-1">{{ msg.contenu }}</p>
                        <small class="{{ 'text-white-50' if msg.expediteur_id == current_user.id else 'text-muted' }}">
                            {{ msg.created_at.strftime('%H:%M') }}
                        </small>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="card-footer">
                <form method="POST" class="d-flex gap-2">
                    <input type="text" name="message" class="form-control" placeholder="Ecrivez votre message..." required>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
