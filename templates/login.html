{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 text-primary">
                    <i class="bi bi-shield-lock"></i> Connexion
                </h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email ou Telephone</label>
                        <input type="text" name="identifiant" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Se connecter
                    </button>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Pas encore de compte ? <a href="{{ url_for('register') }}">S'inscrire</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
